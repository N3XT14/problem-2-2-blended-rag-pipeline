# Fill this in before you submit -- our evaluator runs these commands
# EXACTLY as written, in this order, from a fresh checkout of your fork.
# Keep every command non-interactive (no prompts) and idempotent.

setup_commands:
  - "pip install -r requirements.txt"
  - "docker compose up -d"

run_commands:
  - "python src/ingest.py --corpus data/corpus/ --out data/chunks.json"
  - "python src/index.py --chunks data/chunks.json"
  - "python src/retrieve.py --query 'refrigerant charge procedure for 48AJ060' --top-k 5"

test_commands:
  - "python src/eval.py --top-k 5 --out results/eval_results.json"

notes: "Requires Docker for Elasticsearch. Ingest takes ~5 min for 15 PDFs. Index build takes ~2 min (CPU embeddings). Eval runs 40 questions against live ES. No GPU needed."
