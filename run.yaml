setup_commands:
  - "pip install -r requirements.txt"
  - "docker compose up -d"
  - "docker compose wait elasticsearch || sleep 30"

run_commands:
  - "python src/ingest.py --corpus data/corpus/ --out data/chunks.json"
  - "python src/index.py --chunks data/chunks.json"
  - "python src/retrieve.py --query 'refrigerant charge procedure for 48AJ060' --top-k 5"

test_commands:
  - "python src/eval.py --top-k 5 --strategy best_fields --out results/eval_results.json"

notes: "Requires Docker for Elasticsearch 9.0.3. PDFs are in data/corpus/ (15 files, committed). Ingest ~2 min. Index build ~15 min on CPU or ~2 min on GPU (code auto-detects CUDA via torch.cuda.is_available()). Eval ~2 min. GPU path not tested — requires Docker and CUDA on the same machine."
